version: "3.1"

rules:
  - rule: responder a saludo
    steps:
      - intent: saludar
      - action: utter_saludar

  - rule: responder despedida
    steps:
      - intent: despedir
      - action: utter_despedir

  - rule: responder identidad
    steps:
      - intent: desafiar_bot
      - action: utter_soy_bot

  - rule: fallback por defecto
    steps:
      - intent: nlu_fallback
      - action: utter_no_entendi
