version: "3.1"

rules:
  - rule: responder a saludo
    steps:
      - intent: saludar
      - action: utter_saludar

  - rule: responder despedida
    steps:
      - intent: despedir
      - action: utter_despedir

  - rule: responder identidad
    steps:
      - intent: desafiar_bot
      - action: utter_soy_bot

  - rule: pregunta libre al LLM
    steps:
      - intent: preguntar_llm
      - action: action_llm_responder

  - rule: fallback con LLM
    steps:
      - intent: nlu_fallback
      - action: action_llm_responder
