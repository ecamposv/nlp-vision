version: "3.1"

stories:
  - story: saludo y pregunta de curso
    steps:
      - intent: saludar
      - action: utter_saludar
      - intent: preguntar_curso
      - action: utter_info_curso

  - story: consulta de horario
    steps:
      - intent: preguntar_horario
      - action: utter_info_horario

  - story: despedida
    steps:
      - intent: despedir
      - action: utter_despedir

  - story: identidad del bot
    steps:
      - intent: desafiar_bot
      - action: utter_soy_bot

  - story: pregunta libre al LLM
    steps:
      - intent: preguntar_llm
      - action: action_llm_responder
